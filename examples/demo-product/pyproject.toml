[project]
name = "backit-demo-product"
version = "0.1.0"
description = "Demo builder product that receives signed BackIt webhooks"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.151.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.fastapi]
entrypoint = "demo_product.main:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
