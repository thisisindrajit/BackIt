[project]
name = "backit-api"
version = "0.1.0"
description = "BackIt API: founding-backer campaigns with referral commissions (PayPal + AI MVP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.151.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101", "S311", "B008", "RUF012", "UP047", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
